<!--
    ModeSwitcherComponent
    ---------------------
    - Uses <app-spin-button> to switch between available modes (light/dark/etc).
    - Accessible: ariaLabel input translated (i18n, via ngx-translate).
    - Icon or text updates dynamically based on the current mode.
-->

<app-spin-button
    [values]="modeOptions"
    [ariaLabel]="'aria.selectMode' | translate"
    (optionChange)="setMode($event)"
    [value]="currentModeOption()"
/>
